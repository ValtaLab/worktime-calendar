<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0">
<meta name="theme-color" content="#2563eb">
<meta name="description" content="工時月曆 — 快速記錄每日工時與加班，月曆一目了然">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="工時月曆">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="icon" href="./icons/icon-192.png">
<title>工時月曆</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="17" rx="2.5"></rect>
            <path d="M3 9.5h18M8 2.5v4M16 2.5v4"></path>
          </svg>
        </span>
        <h1>工時月曆</h1>
      </div>

      <nav class="month-nav" aria-label="月份切換">
        <button id="prevMonth" class="nav-btn" type="button" aria-label="上一個月">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <button id="todayBtn" class="today-btn" type="button">今天</button>
        <button id="nextMonth" class="nav-btn" type="button" aria-label="下一個月">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
        </button>
      </nav>

      <button id="menuBtn" class="icon-btn" type="button" aria-label="更多操作" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg>
      </button>
    </div>

    <div class="month-title-row">
      <h2 id="monthTitle" class="month-title">—</h2>
      <div id="monthStats" class="month-stats"></div>
    </div>
  </header>

  <main class="calendar-wrap">
    <div class="weekday-row" id="weekdayRow"></div>
    <div id="calendarGrid" class="calendar-grid" role="grid" aria-label="月曆"></div>
    <!-- 收入總計：需在選單設定日薪與加班時薪後才顯示 -->
    <div id="incomeBar" class="income-bar" hidden></div>
  </main>

  <footer class="hint-bar">
    <span class="hint-icon" aria-hidden="true">👆</span>
    <span>雙擊日期可新增工時 / 加班描述</span>
  </footer>
</div>

<!-- ============ 編輯面板 ============ -->
<div id="sheetBackdrop" class="sheet-backdrop" hidden></div>
<section id="sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
  <div class="sheet-handle" aria-hidden="true"></div>

  <header class="sheet-head">
    <div>
      <p id="sheetDate" class="sheet-date">—</p>
      <h3 id="sheetTitle" class="sheet-title">新增記錄</h3>
    </div>
    <button id="sheetClose" class="icon-btn" type="button" aria-label="關閉">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
  </header>

  <div class="sheet-body">
    <!-- 工時區塊 -->
    <section class="field-group">
      <h4 class="group-title"><span class="dot dot-work"></span>工時</h4>

      <div class="field">
        <label class="field-label" for="workDesc">描述</label>
        <textarea id="workDesc" rows="3" placeholder="例：專案 A 開發、需求評審…"></textarea>
      </div>

      <div class="field">
        <span class="field-label" id="workUnitsLabel">工數</span>
        <div class="unit-picker unit-picker-2" id="workUnitPicker" role="radiogroup" aria-labelledby="workUnitsLabel">
          <button type="button" class="unit-chip unit-chip-lg" data-value="0.5" role="radio" aria-checked="false">
            <span class="chip-main">0.5 工</span>
            <span class="chip-sub">半日</span>
          </button>
          <button type="button" class="unit-chip unit-chip-lg" data-value="1" role="radio" aria-checked="false">
            <span class="chip-main">1 工</span>
            <span class="chip-sub">全日</span>
          </button>
        </div>
        <p class="field-help" id="workEquivalent">＝ 8 小時</p>
      </div>
    </section>

    <!-- 加班區塊 -->
    <section class="field-group">
      <h4 class="group-title"><span class="dot dot-ot"></span>加班</h4>

      <div class="field">
        <label class="field-label" for="otDesc">描述</label>
        <textarea id="otDesc" rows="2" placeholder="例：上線支援、客戶會議…"></textarea>
      </div>

      <div class="field">
        <span class="field-label" id="otUnitsLabel">加班時數</span>
        <div class="stepper stepper-ot">
          <button type="button" class="step-btn" data-target="otHours" data-delta="-0.5" aria-label="減少半小時">−</button>
          <div class="stepper-display">
            <input id="otHours" type="number" inputmode="decimal" step="0.5" min="0" max="24" value="0">
            <span class="stepper-unit">小時</span>
          </div>
          <button type="button" class="step-btn" data-target="otHours" data-delta="0.5" aria-label="增加半小時">+</button>
        </div>
        <p class="field-help" id="otEquivalent">每次調整 0.5 小時</p>
      </div>
    </section>

    <div class="field">
      <label class="field-label" for="tagsInput">標籤（選填）</label>
      <input id="tagsInput" type="text" placeholder="以逗號分隔，例：出差, 遠端">
    </div>
  </div>

  <footer class="sheet-foot">
    <button id="deleteBtn" class="btn btn-danger" type="button" hidden>刪除</button>
    <button id="cancelBtn" class="btn btn-ghost" type="button">取消</button>
    <button id="saveBtn" class="btn btn-primary" type="button">儲存</button>
  </footer>
</section>

<!-- ============ 側邊選單 ============ -->
<div id="drawerBackdrop" class="sheet-backdrop" hidden></div>
<aside id="drawer" class="drawer" hidden aria-label="選單">
  <header class="drawer-head">
    <h3>工時月曆</h3>
    <button id="drawerClose" class="icon-btn" type="button" aria-label="關閉">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
  </header>

  <div class="drawer-section">
    <p class="drawer-label">1 工 = 幾小時</p>
    <div class="stepper stepper-wide">
      <button type="button" class="step-btn" data-target="stdHours" data-delta="-0.5">−</button>
      <input id="stdHours" type="number" inputmode="decimal" step="0.5" min="0.5" max="24" value="8">
      <button type="button" class="step-btn" data-target="stdHours" data-delta="0.5">+</button>
    </div>
    <p class="drawer-help">用來換算「1 工」對應的實際小時數，也是達標率的計算基準</p>
  </div>

  <div class="drawer-section">
    <p class="drawer-label">薪資設定</p>
    <div class="pay-field">
      <label class="pay-label" for="dayPay">日薪（1 工）</label>
      <div class="pay-input-wrap">
        <span class="pay-prefix">$</span>
        <input id="dayPay" class="pay-input" type="number" inputmode="decimal"
               step="100" min="0" placeholder="0" value="">
      </div>
    </div>
    <div class="pay-field">
      <label class="pay-label" for="otPay">加班時薪</label>
      <div class="pay-input-wrap">
        <span class="pay-prefix">$</span>
        <input id="otPay" class="pay-input" type="number" inputmode="decimal"
               step="10" min="0" placeholder="0" value="">
      </div>
    </div>
    <p class="drawer-help">設定後，月曆下方會顯示本月收入總計（工數 × 日薪 ＋ 加班時數 × 加班時薪）。留空或 0 則不顯示。</p>
  </div>

  <div class="drawer-section">
    <p class="drawer-label">顯示選項</p>
    <label class="switch-row">
      <span>顯示週末</span>
      <input id="optWeekend" type="checkbox" checked>
    </label>
    <label class="switch-row">
      <span>月曆上顯示工數</span>
      <input id="optShowHours" type="checkbox" checked>
    </label>
    <label class="switch-row">
      <span>週一為每週第一天</span>
      <input id="optMondayFirst" type="checkbox" checked>
    </label>
  </div>

  <div class="drawer-section">
    <p class="drawer-label">資料</p>
    <button id="exportCsv" class="drawer-btn" type="button">匯出 CSV（本月）</button>
    <button id="exportJson" class="drawer-btn" type="button">匯出備份 JSON</button>
    <button id="importJson" class="drawer-btn" type="button">匯入備份 JSON</button>
    <input id="importFile" type="file" accept="application/json,.json" hidden>
    <button id="clearAll" class="drawer-btn drawer-btn-danger" type="button">清除全部資料</button>
  </div>

  <div class="drawer-section drawer-about">
    <p id="installHint" class="drawer-help"></p>
    <p class="drawer-help">資料儲存在此裝置的瀏覽器中，離線可用。</p>
  </div>

  <div class="drawer-section">
    <p class="drawer-label">版本</p>
    <div class="version-row">
      <div>
        <p class="version-num" id="verCurrent">—</p>
        <p class="drawer-help" id="verBuild"></p>
      </div>
      <button id="checkUpdateBtn" class="drawer-btn version-check" type="button">檢查更新</button>
    </div>
    <p class="drawer-help" id="verStatus"></p>
  </div>
</aside>

<!-- ============ 更新提示橫幅 ============ -->
<div id="updateBar" class="update-bar" role="status" aria-live="polite" hidden>
  <div class="update-bar-inner">
    <span class="update-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12a9 9 0 1 1-2.6-6.4"></path>
        <path d="M21 3v6h-6"></path>
      </svg>
    </span>
    <div class="update-text">
      <p class="update-title">有新版本可用</p>
      <p class="update-desc" id="updateDesc">更新後即可使用最新功能</p>
    </div>
    <button id="updateNowBtn" class="update-btn" type="button">立即更新</button>
    <button id="updateLaterBtn" class="update-close" type="button" aria-label="稍後再說">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script src="./app.js"></script>
</body>
</html>
